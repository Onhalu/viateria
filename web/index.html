<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="VANDERY — gamified tourist challenges.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="VANDERY">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>VANDERY</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #F3EFE5;
    }
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      background: #F3EFE5;
    }
    #splash img {
      width: 148px;
      height: auto;
    }
    #splash .track {
      width: 148px;
      height: 2px;
      background: rgba(53, 72, 60, 0.18);
      overflow: hidden;
    }
    #splash .bar {
      width: 40%;
      height: 2px;
      background: #35483C;
      animation: vandery-splash 1.2s ease-in-out infinite;
    }
    @keyframes vandery-splash {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(320%); }
    }
    @media (prefers-reduced-motion: reduce) {
      #splash .bar { animation: none; width: 100%; }
    }
  </style>
</head>
<body>
  <div id="splash" role="progressbar" aria-label="VANDERY">
    <img src="brand/vandery-lockup.png" alt="VANDERY" width="148">
    <div class="track" aria-hidden="true"><div class="bar"></div></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (splash) splash.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
