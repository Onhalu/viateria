name: viateria
description: Gamified tourist challenges — Flutter MVP (SPEC v1).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  confetti: ^0.8.0
  flutter_map: ^8.1.1
  flutter_riverpod: ^2.6.1
  geolocator: ^14.0.2
  go_router: ^16.2.0
  http: ^1.5.0
  image_picker: ^1.1.2
  intl: ^0.20.2
  latlong2: ^0.9.1
  maplibre_gl: ^0.27.0
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  supabase_flutter: ^2.9.0
  url_launcher: ^6.3.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/map/pois.geojson
    - assets/map/icons/castle@2x.png
    - assets/map/icons/chateau@2x.png
    - assets/map/icons/ruin@2x.png
    - assets/map/icons/church@2x.png
    - assets/map/icons/other@2x.png
    - assets/map/icons/cluster@2x.png
